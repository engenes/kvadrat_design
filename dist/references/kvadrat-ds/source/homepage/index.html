<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Квадрат — Агентство недвижимости</title>
<link rel="stylesheet" href="../../styles.css">
<script src="../../_ds_bundle.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #e4e9ec; }
  body { font-family: var(--font-sans); }
  a { color: var(--blue-500); text-decoration: none; }
  a:hover { color: var(--blue-600); }
  #stage-outer { width: 100%; overflow: hidden; }
  #stage { width: 1920px; transform-origin: top left; background: var(--surface-white); }
</style>
</head>
<body>
<div id="stage-outer"><div id="stage"><div id="root"></div></div></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="./Hero.jsx"></script>
<script type="text/babel" src="./Services.jsx"></script>
<script type="text/babel" src="./Mortgage.jsx"></script>
<script type="text/babel" src="./Promo.jsx"></script>
<script type="text/babel" src="./Catalog.jsx"></script>
<script type="text/babel" src="./SearchPanel.jsx"></script>
<script type="text/babel" src="./TeamBio.jsx"></script>
<script type="text/babel" src="./LoremSection.jsx"></script>
<script type="text/babel" src="./CTA.jsx"></script>
<script type="text/babel" src="./News.jsx"></script>
<script type="text/babel" src="./Blog.jsx"></script>
<script type="text/babel" src="./FooterSection.jsx"></script>
<script type="text/babel" src="./App.jsx"></script>
<script>
  function fit() {
    var s = window.innerWidth / 1920;
    var stage = document.getElementById('stage');
    stage.style.transform = 'scale(' + s + ')';
    document.getElementById('stage-outer').style.height = Math.round(stage.offsetHeight * s) + 'px';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('load', function () { setTimeout(fit, 80); });
  var root = document.getElementById('root');
  var mo = new MutationObserver(function () { fit(); });
  mo.observe(root, { childList: true, subtree: true });
</script>
</body>
</html>
