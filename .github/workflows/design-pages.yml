name: Design Pages

on:
  push:
    branches: [disign]

permissions:
  contents: read

concurrency:
  group: design-pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify mockups
        run: |
          node scripts/verify.mjs
          node scripts/verify-navigation.mjs
      - name: Upload site
        if: vars.DESIGN_PAGES_ENABLED == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/disign' && vars.DESIGN_PAGES_ENABLED == 'true'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy mockups
        id: deployment
        uses: actions/deploy-pages@v4
